name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: |
          Z=$(ls x[0-9][0-9].zip | sort | tail -1)
          echo "Zip: $Z"
          unzip -q $Z
          curl -L -o m.zip https://alphacephei.com/vosk/models/vosk-model-small-uz-0.22.zip
          unzip -q m.zip
          cp -r vosk-model-small-uz-0.22/* Xoqon/app/src/main/assets/model-uz/
      - run: gradle -p Xoqon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: xoqon-apk
          path: Xoqon/app/build/outputs/apk/debug/app-debug.apk
